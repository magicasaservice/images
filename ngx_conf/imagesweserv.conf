# Please adjust cache size (max_size=250m) to a value that you can accommodate in RAM! Advised values: 2 GB RAM: 500m, 4 GB RAM: 1g, 8 GB RAM: 2g, etc..

map $upstream_status $no_cache_error {
    ~^5      1;  # All 5xx (server/processing errors)
    ~^4[^1]  1;  # 400-409, 420-499  (bad request, forbidden, not found, rate limit, ...)
    ~^41[^0] 1;  # 411-419           (not 410 Gone — permanently unavailable, safe to cache)
    default  0;
}

# Cache-Control value sent downstream to Cloudflare and browsers.
# Errors must not be cached anywhere — no-store prevents CDN and browser caching.
map $no_cache_error $response_cache_control {
    1        "no-store";
    default  "public, max-age=31536000, immutable";
}

# High-performance proxy cache optimized for CCX33 + 4GB SHM
proxy_cache_path /dev/shm/proxy_cache inactive=12h levels=1:2 keys_zone=images:2048m max_size=6g loader_files=15000 loader_threshold=200ms use_temp_path=off;
proxy_cache_min_uses 1;  # Cache on first use for better performance
proxy_read_timeout 120s;  # Increased for large images
proxy_send_timeout 120s;  # Increased for large images
proxy_buffers 1024 32k;  # Doubled buffer count and size
proxy_buffer_size 64k;  # Larger buffer for headers
proxy_busy_buffers_size 128k;  # More busy buffers
proxy_temp_file_write_size 128k;  # Larger temp write size
proxy_buffering on;

# Enhanced client optimizations
client_body_buffer_size 512k;  # Doubled for better upload handling
client_header_buffer_size 16k;  # Doubled header buffer
large_client_header_buffers 16 32k;  # More and larger header buffers
client_body_timeout 30s;  # Faster client timeouts
client_header_timeout 30s;

# Configuration directives
weserv_process_timeout 90s;  # Increased processing time for large images

# DNS resolvers with aggressive caching - Docker internal DNS + Cloudflare + Google fallback
resolver 127.0.0.11 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=900s ipv6=off;

# Denies access to loopback IP addresses
weserv_deny_ip 127.0.0.0/8;
weserv_deny_ip ::1/128;

# Denies access to link-local and multicast IP addresses
weserv_deny_ip 169.254.0.0/16;
weserv_deny_ip 224.0.0.0/4;
weserv_deny_ip fe80::/64;
weserv_deny_ip ff00::/8;

# Denies access to private IP addresses
weserv_deny_ip 10.0.0.0/8;
weserv_deny_ip 172.16.0.0/12;
weserv_deny_ip 192.168.0.0/16;
weserv_deny_ip fc00::/7;

# Pixel limits
weserv_limit_input_pixels 200000000;
weserv_limit_output_pixels 200000000;

upstream images {
    server 127.0.0.1:80;

    # CCX33 optimized connection pooling
    keepalive 800;  # Take advantage of 8 vCPUs
    keepalive_requests 3000;  # Higher requests per connection
    keepalive_timeout 120s;  # Longer connection timeout
}


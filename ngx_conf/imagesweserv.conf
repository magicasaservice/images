server {
    listen 80;

    server_name images.weserv.local;

    access_log off;
    error_log /var/log/nginx/weserv-local-error.log;

    root /var/www/imagesweserv/public;
    absolute_redirect off;

    error_page 404 /404.html;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        # DNS resolver is now set globally above - removed local resolver
        weserv proxy;

        add_header X-Upstream-Response-Length $weserv_response_length;
        # Performance caching header
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /static/ {
        weserv filter;

        alias /var/www/imagesweserv/public/;
        
        # Static file optimization
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;

    server_name _;

    # High-performance logging with larger buffers
    access_log /var/log/nginx/weserv-access.log main buffer=16384 flush=30s;
    access_log /var/log/nginx/weserv-stats.log stats buffer=16384 flush=30s;
    error_log /var/log/nginx/weserv-error.log;

    root /var/www/imagesweserv/public;

    include weserv-headers.conf;
    add_header X-Cache-Status $upstream_cache_status;

    location / {
        expires 1y; # Far-future expiration for static files
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri.html$is_args @proxy;
    }

    location = /clear-cache/ {
        return 301 /clear-cache;
    }

    location = /clear-cache {
        default_type application/json;
        include weserv-headers.conf;
        add_header Cache-Control 'no-store, must-revalidate';
        add_header Clear-Site-Data '"cache", "storage"';
        return 200 '{"status":"success", "code":200, "message":"Browser cache successfully cleared!"}';
    }

    # location = /quota/ {
    #     return 301 /quota;
    # }

    # location = /quota {
    #     rate_limit $limit_key requests=2500 period=10m burst=2499;
    #     rate_limit_quantity 0;
    #     rate_limit_pass valkey;
    #     rate_limit_headers on;
    #
    #     error_page 404 =200 @quota;
    # }

    # location @quota {
    #     default_type application/json;
    #     include weserv-headers.conf;
    #     add_header Cache-Control 'no-store, must-revalidate';
    #     if ($limit = 0) {
    #         return 200 '{"status":"success", "code":200, "message":"Your IP address ($remote_addr) bypasses the rate limiter, have fun!"}';
    #     }
    #     return 200 '{"X-RateLimit-Limit":$sent_http_x_ratelimit_limit, "X-RateLimit-Remaining":$sent_http_x_ratelimit_remaining, "X-RateLimit-Reset":$sent_http_x_ratelimit_reset}';
    # }

    location @proxy {
        proxy_cache images;
        proxy_cache_key '$request_method|wsrv.nl|$request_uri';
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $http_pragma $http_authorization;
        proxy_cache_valid 200 301 410 30d;
        proxy_cache_valid any 8h;
        proxy_no_cache $no_cache_error;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        # Aggressive cache optimizations
        proxy_cache_background_update on;  # Update cache in background
        proxy_cache_lock on;  # Prevent cache stampedes
        proxy_cache_lock_timeout 10s;  # Longer lock timeout
        proxy_cache_revalidate on;  # Revalidate stale cache
        
        # Response optimization
        proxy_ignore_headers "Set-Cookie" "Vary" "Cache-Control" "Expires";
        # Hide the upstream Cache-Control so we can replace it with our own conditional value below.
        # Without this, the upstream's "public, max-age=31536000, immutable" would be forwarded
        # to Cloudflare even for error responses, causing them to be cached at the CDN layer.
        proxy_hide_header Cache-Control;

        proxy_pass http://images;
        proxy_set_header Host images.weserv.local;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Original-Scheme $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Enable the upstream persistent connection
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Response headers — must be explicit here because adding any add_header directive
        # to a location block disables inheritance of server-level add_header directives.
        include weserv-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control $response_cache_control always;

        # 2500 allowed requests in 10 minutes
        # rate_limit $limit_key requests=2500 period=10m burst=2499;
        # rate_limit_pass valkey;
    }
}
